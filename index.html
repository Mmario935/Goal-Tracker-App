<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RPG Metas</title>
  <meta name="description" content="Seguimiento de hábitos y metas con estadísticas de RPG.">
  <meta name="theme-color" content="#14111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RPG Metas">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="main" class="main"></main>

  <nav class="tabbar">
    <button class="tab on" data-view="today"><span>✅</span>Hoy</button>
    <button class="tab" data-view="character"><span>🧙</span>Personaje</button>
    <button class="tab" data-view="stats"><span>📈</span>Estadísticas</button>
    <button class="tab" data-view="settings"><span>⚙️</span>Ajustes</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
